<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Status — Astrological Solutions</title><meta name="theme-color" content="#fffaf0"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf0;color:#10243b;font-family:Inter,Arial,sans-serif}.card{width:min(560px,88vw);padding:42px;border:1px solid #dfcfaa;border-radius:28px;background:#fffdf7;text-align:center;box-shadow:0 25px 80px #8d70201f}.icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#ffd21a;font-size:34px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9a7b19;font-weight:800}h1{font:500 42px Georgia;margin:12px 0}p{color:#667080;line-height:1.7}.btn{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:999px;background:#10243b;color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="card"><div class="icon" id="icon">✓</div><div class="eyebrow">ASTROLOGICAL SOLUTIONS</div><h1 id="title">Payment successful</h1><p id="copy">Your transaction has been received. Keep your transaction ID for reference.</p><p><b id="txnid"></b></p><a class="btn" href="/">Back to website</a></main><script>const q=new URLSearchParams(location.search),ok=q.get("status")==="success";document.getElementById("icon").textContent=ok?"✓":"!";document.getElementById("title").textContent=ok?"Payment successful":"Payment not completed";document.getElementById("copy").textContent=ok?"Your payment was verified by Astrological Solutions.":"The payment was not completed. You can return and try again.";document.getElementById("txnid").textContent=q.get("txnid")?"Transaction ID: "+q.get("txnid"):"";</script></body></html>
