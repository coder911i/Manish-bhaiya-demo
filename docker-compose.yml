services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: astrological_solutions
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [astro_data:/var/lib/postgresql/data]
volumes:
  astro_data:
